      - title: Total immersion hours
        src: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTW4RE1876EVDTvxuh2BNZ7almwjZpKVA-sptsS2AQiNCqPQlbdWnSUKbrsp5U5R5g6mWqys47vmrp9/pubchart?oid=2033727055&format=image"
        x: 15
